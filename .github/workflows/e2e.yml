name: E2E (Obsidian)

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 22.x
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "npm"
            - name: Install Obsidian system libraries and Xvfb
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libnss3 libgbm1 libgtk-3-0 libasound2t64 libsecret-1-0 libxss1
            - run: npm ci
            - name: Run Obsidian e2e tests
              run: xvfb-run -a npm run test:e2e
            - name: Upload wdio logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-logs
                  path: |
                      .obsidian-cache/**/*.log
                      e2e/**/screenshots/**
                  if-no-files-found: ignore
